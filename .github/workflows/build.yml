name: Build TaobaoLingo
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
  packages: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.8.1'
      - name: Build Morphe patch bundle
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gradle buildAndroid --no-daemon --stacktrace
      - name: Upload Morphe MPP
        uses: actions/upload-artifact@v4
        with:
          name: TaobaoLingo-Morphe-${{ github.sha }}
          path: patches/build/libs/*.mpp
          if-no-files-found: error
