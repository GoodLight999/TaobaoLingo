name: Android emulator smoke test
on:
  workflow_dispatch:
  push:
    paths:
      - 'overlay/**'
      - '.github/workflows/overlay-smoke.yml'
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Build helper and OCR instrumentation APKs
        working-directory: overlay
        run: gradle :app:assembleDebug :app:assembleDebugAndroidTest --no-daemon
      - name: Install checksum-verified stable emulator (bypass broken latest SDK package)
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 4 --retry-all-errors --retry-delay 5 \
            -o "$RUNNER_TEMP/emulator-36.6.11.zip" \
            https://dl.google.com/android/repository/emulator-linux_x64-15507667.zip
          printf '%s  %s\n' \
            1eade4cf2df6ea8eeead4902c635897ba12aaa32aac4389eaae0fdb498a5b830 \
            "$RUNNER_TEMP/emulator-36.6.11.zip" | sha256sum --check
          unzip -q -o "$RUNNER_TEMP/emulator-36.6.11.zip" -d "$ANDROID_SDK_ROOT"
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends libpulse0 libnss3 libasound2t64
          "$ANDROID_SDK_ROOT/emulator/emulator" -version
      - name: Install Android 15 Google APIs image
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager --install 'system-images;android-35;google_apis;x86_64'
      - name: Android 15 boot, app UI, and bundled Chinese OCR
        shell: bash
        run: |
          set -euo pipefail
          sudo chmod 666 /dev/kvm
          echo no | avdmanager create avd --force -n taobaolingo-ci -k 'system-images;android-35;google_apis;x86_64' --device pixel_6
          "$ANDROID_SDK_ROOT/emulator/emulator" -avd taobaolingo-ci \
            -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim \
            -accel on -memory 3072 > "$RUNNER_TEMP/emulator.log" 2>&1 &
          emulator_pid=$!
          cleanup() {
            adb emu kill || true
            kill "$emulator_pid" 2>/dev/null || true
            tail -70 "$RUNNER_TEMP/emulator.log" || true
          }
          trap cleanup EXIT
          timeout 450 bash -c 'until [ "$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d "\r")" = "1" ]; do sleep 5; done'
          adb shell input keyevent 82
          adb install -r overlay/app/build/outputs/apk/debug/app-debug.apk
          adb install -r overlay/app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
          adb shell am start -W -n dev.goodlight999.taobaolingo.overlay/.MainActivity
          sleep 8
          adb shell uiautomator dump /sdcard/window.xml
          adb pull /sdcard/window.xml "$RUNNER_TEMP/window.xml"
          grep -q 'TaobaoLingo' "$RUNNER_TEMP/window.xml"
          grep -q '画面翻訳を開始' "$RUNNER_TEMP/window.xml"
          pid="$(adb shell pidof dev.goodlight999.taobaolingo.overlay)"
          test -n "$pid"
          adb shell am instrument -w dev.goodlight999.taobaolingo.overlay.test/androidx.test.runner.AndroidJUnitRunner \
            | tee "$RUNNER_TEMP/ocr-test.log"
          grep -q 'OK (1 test)' "$RUNNER_TEMP/ocr-test.log"
          echo 'PASS: APK installed, activity rendered, process alive, Chinese OCR recognized image'
