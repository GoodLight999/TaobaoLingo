name: Android emulator smoke test
on:
  workflow_dispatch:
  push:
    paths:
      - 'overlay/**'
      - '.github/workflows/overlay-smoke.yml'
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Build helper APK
        working-directory: overlay
        run: gradle :app:assembleDebug --no-daemon
      - name: Configure hardware virtualization
        run: |
          ls -l /dev/kvm
          sudo chmod 666 /dev/kvm
      - name: Install and launch on Android 15 emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-boot-timeout: 600
          script: |
            adb install -r overlay/app/build/outputs/apk/debug/app-debug.apk
            adb shell am start -W -n dev.goodlight999.taobaolingo.overlay/.MainActivity
            sleep 10
            adb shell dumpsys activity activities | grep -E 'mResumed|mTopResumed|topResumed|ResumedActivity' > /tmp/overlay-activity.txt || true
            adb shell uiautomator dump /sdcard/window.xml
            adb pull /sdcard/window.xml /tmp/overlay-window.xml
            grep -q 'TaobaoLingo' /tmp/overlay-window.xml
            grep -q '画面翻訳を開始' /tmp/overlay-window.xml
            pid=$(adb shell pidof dev.goodlight999.taobaolingo.overlay)
            test -n "$pid"
            if adb logcat -d -v brief | grep -E 'FATAL EXCEPTION.*|Process: dev.goodlight999.taobaolingo.overlay.*'; then
              echo "Unexpected app crash"
              exit 1
            fi
            echo "Emulator smoke passed: install, launch, UI, process"
